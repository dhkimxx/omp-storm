name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm rebuild bun --ignore-scripts=false
      - run: npm run verify

  # The real plugin inside the pinned omp against a scripted fake LLM: no secrets, no paid calls.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm rebuild bun --ignore-scripts=false
      - name: Versions
        run: |
          uname -a
          echo "node $(node --version) · npm $(npm --version) · $(git --version)"
          echo "bun $(node_modules/.bin/bun --version)"
          PATH="$PWD/node_modules/.bin:$PATH" omp --version
          ls node_modules/@oh-my-pi | tr '\n' ' '
      # The harness keeps its work dir (omp stderr, RPC frames, screens, model requests) when a check fails.
      - name: E2E (RPC and print)
        run: E2E_WORK="$RUNNER_TEMP/storm-e2e" npm run e2e
      - name: E2E (automatic delegation and worktree ownership)
        run: E2E_WORK="$RUNNER_TEMP/storm-e2e-auto" npm run e2e:auto
      - name: E2E (checkpoint across a native OMP restart)
        run: E2E_WORK="$RUNNER_TEMP/storm-e2e-checkpoint" node_modules/.bin/bun scripts/e2e/checkpoint-resume.ts
      # A follow-up's result must reach the result ledger even though omp reuses the agent id as the job id (about 75 s:
      # the script waits out omp's 30 s eviction of a consumed job row). The probe checks what omp reports at the write
      # (about 100 s), so a changed omp job lifecycle fails here before it silently loses results.
      - name: E2E (follow-up results reach the ledger)
        run: E2E_WORK="$RUNNER_TEMP/storm-e2e-follow-up" node_modules/.bin/bun scripts/e2e/follow-up-ledger.ts
      - name: E2E (omp job rows at a follow-up write)
        run: E2E_WORK="$RUNNER_TEMP/storm-e2e-job-snapshot" node_modules/.bin/bun scripts/e2e/follow-up-job-snapshot.ts
      # A run omp's host died in is found at the next start and the director continues it when the user says to go on.
      - name: E2E (the director continues a run the host cut off)
        run: E2E_WORK="$RUNNER_TEMP/storm-e2e-continue" node_modules/.bin/bun scripts/e2e/continue.ts
      # omp's goal and loop modes exist only in its TUI, which the harness drives on a pty.
      - name: Can this runner open a pty?
        id: pty
        if: ${{ !cancelled() }}
        run: |
          if node_modules/.bin/bun -e 'const p = Bun.spawn(["sh", "-c", "test -t 0 && echo tty"], { terminal: { cols: 80, rows: 24, data(_t, d) { process.stdout.write(d); } } }); await p.exited;' | grep -q tty; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No pty on this runner: the TUI scenarios (goal and loop runs, setup forms) did not run."
          fi
      - name: E2E (TUI)
        if: ${{ !cancelled() && steps.pty.outputs.ok == 'true' }}
        run: E2E_WORK="$RUNNER_TEMP/storm-e2e-tui" npm run e2e:tui
      - name: Upload the work dirs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storm-e2e-work
          include-hidden-files: true
          if-no-files-found: ignore
          # The linked plugin is a symlink to the checkout: the artifact needs the logs, not the repo again.
          path: |
            ${{ runner.temp }}/storm-e2e*/
            !${{ runner.temp }}/storm-e2e*/home/.omp/**/plugins/**
            !${{ runner.temp }}/storm-e2e*/home/.omp/**/natives/**
