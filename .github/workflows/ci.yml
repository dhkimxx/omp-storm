name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm rebuild bun --ignore-scripts=false
      - run: npm run verify

  # The real plugin inside the pinned omp against a scripted fake LLM: no secrets, no paid calls.
  #
  # Every end-to-end scenario and the environment each needs live in one list, `scripts/e2e/suites.ts`. `npm run e2e:all`
  # runs the scenarios side by side (four at a time; a scenario that fails beside others is rerun alone once), and each
  # job below runs one group of that list: `--group e2e`, `--group e2e-guarantees`, `--group e2e-tui`. The groups keep
  # every job inside its 20 minute limit as a guard against a hung scenario, not as a budget: the slowest scenario in a
  # group is about 3 minutes (TUI), so a group's wall time is close to that rather than to the sum of its scenarios.
  # The `qa` group holds the release-QA scenarios no CI job runs; `scripts/e2e/qa-linux.sh` runs every group in order.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm rebuild bun --ignore-scripts=false
      - name: Versions
        run: |
          uname -a
          echo "node $(node --version) · npm $(npm --version) · $(git --version)"
          echo "bun $(node_modules/.bin/bun --version)"
          PATH="$PWD/node_modules/.bin:$PATH" omp --version
          ls node_modules/@oh-my-pi | tr '\n' ' '
      # RPC and print surfaces, automatic delegation, checkpoint across a native restart, the follow-up ledger, omp's job
      # rows at a follow-up write, and continue-after-host-death. The harness keeps each scenario's work dir (omp stderr,
      # RPC frames, screens, model requests) when a check fails.
      - name: E2E (RPC, automatic delegation, the native lifecycle)
        run: E2E_WORK_ROOT="$RUNNER_TEMP" npm run e2e:all -- --group e2e
      - name: Upload the work dirs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storm-e2e-work
          include-hidden-files: true
          if-no-files-found: ignore
          # The linked plugin is a symlink to the checkout: the artifact needs the logs, not the repo again.
          path: |
            ${{ runner.temp }}/storm-e2e*/
            !${{ runner.temp }}/storm-e2e*/home/.omp/**/plugins/**
            !${{ runner.temp }}/storm-e2e*/home/.omp/**/natives/**

  # Phase 1 (the record and the director's reads) and the hardening of the four guarantees (the pins on model and effort,
  # the write order, the end of a job, a named service), plus the 0.28.0 director edit and release gate.
  e2e-guarantees:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm rebuild bun --ignore-scripts=false
      - name: Versions
        run: |
          uname -a
          echo "node $(node --version) · npm $(npm --version) · $(git --version)"
          echo "bun $(node_modules/.bin/bun --version)"
          PATH="$PWD/node_modules/.bin:$PATH" omp --version
          ls node_modules/@oh-my-pi | tr '\n' ' '
      # A woken worker's answer, an early-start lane, the director's reads under automatic delegation, the approved model
      # and effort, two writers on one tree, the host facts the write order leans on, the director's own edits, a read
      # lane with a shell, and Storm installed in a folder with no node_modules.
      - name: E2E (phase 1 and the hardening guarantees)
        run: E2E_WORK_ROOT="$RUNNER_TEMP" npm run e2e:all -- --group e2e-guarantees
      - name: Upload the work dirs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storm-e2e-work-guarantees
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/storm-e2e*/
            !${{ runner.temp }}/storm-e2e*/home/.omp/**/plugins/**
            !${{ runner.temp }}/storm-e2e*/home/.omp/**/natives/**

  # omp's goal and loop modes and plan mode exist only in its TUI, which the harness drives on a pty.
  e2e-tui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm rebuild bun --ignore-scripts=false
      - name: Versions
        run: |
          uname -a
          echo "node $(node --version) · npm $(npm --version) · $(git --version)"
          echo "bun $(node_modules/.bin/bun --version)"
          PATH="$PWD/node_modules/.bin:$PATH" omp --version
          ls node_modules/@oh-my-pi | tr '\n' ' '
      - name: Can this runner open a pty?
        id: pty
        if: ${{ !cancelled() }}
        run: |
          if node_modules/.bin/bun -e 'const p = Bun.spawn(["sh", "-c", "test -t 0 && echo tty"], { terminal: { cols: 80, rows: 24, data(_t, d) { process.stdout.write(d); } } }); await p.exited;' | grep -q tty; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No pty on this runner: the TUI scenarios (goal and loop runs, setup forms, plan mode) did not run."
          fi
      - name: E2E (TUI)
        if: ${{ !cancelled() && steps.pty.outputs.ok == 'true' }}
        run: E2E_WORK_ROOT="$RUNNER_TEMP" npm run e2e:all -- --group e2e-tui
      - name: Upload the work dirs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storm-e2e-work-tui
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/storm-e2e*/
            !${{ runner.temp }}/storm-e2e*/home/.omp/**/plugins/**
            !${{ runner.temp }}/storm-e2e*/home/.omp/**/natives/**
